name: fastfetch

on:
  schedule:
    - cron: "30 18 * * *" # daily, midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fastfetch.py, ascii.txt]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 fastfetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only commit when the numbers actually moved.
      - run: |
          git diff --quiet -- fastfetch-*.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fastfetch-*.svg
          git commit -m "chore: refresh fastfetch"
          git push
